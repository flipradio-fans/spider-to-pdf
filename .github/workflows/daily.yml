name: Daily Python Run

on:
  schedule:
    # 每天 UTC 15:00（北京时间 23:00）运行
    - cron: "0 15 * * *"
  workflow_dispatch:  # 可选，支持手动触发

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      # 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"  # 可以改成你需要的版本

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 运行 Python 脚本
      - name: Run Python script
        run: python spider-to-pdf/main.py

      # 配置 Git 信息
      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Daily update: $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

      # 推送更改
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
